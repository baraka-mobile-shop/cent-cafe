<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cent</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fraunces:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:30px}
  .land-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  .land-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px 30px;width:320px;max-width:100%;text-decoration:none;color:inherit;display:block;transition:transform .1s}
  .land-card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .land-card h2{font-size:19px;font-weight:800;margin:14px 0 6px}
  .land-card p{font-size:13px;color:var(--muted);line-height:1.7}
  .land-ic{width:52px;height:52px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="land">
  <a class="brand" style="pointer-events:none">
    <div class="mark" style="width:64px;height:64px;border-radius:18px"><svg viewBox="0 0 24 24" fill="none" stroke="#E8C78F" stroke-width="1.8" stroke-linecap="round" style="width:34px;height:34px"><path d="M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 5.5c0-1 .8-1.2.8-2M11.5 5.5c0-1 .8-1.2.8-2"/></svg></div>
    <h1 style="font-size:44px"><span class="wordmark">Cent</span></h1>
  </a>
  <div class="land-cards">
    <a class="land-card" href="pos.html">
      <div class="land-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
      <h2>نظام الكاشير</h2>
      <p>شاشة الكاشير والمنيو والتحضير والتقارير وقفل الوردية. يتثبّت على ويندوز من كروم أو إيدج كتطبيق مستقل ويشتغل أوفلاين.</p>
    </a>
    <a class="land-card" href="site.html">
      <div class="land-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/></svg></div>
      <h2>موقع العملاء</h2>
      <p>المنيو كامل للطلب من الموبايل: من الطاولة بـ QR، استلام من الفرع، أو طلب دليفري. الدفع كاش عند الاستلام.</p>
    </a>
  </div>
</div>
</body>
  </html>
